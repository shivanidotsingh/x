<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Kind of Force Are You?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,700;1,800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f0ead8;
  --ink:   #1c1209;
  --red:   #d4342a;
  --mono:  'Courier New', Courier, monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Barlow', 'Courier New', Courier, monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

/* linen texture */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(160,140,100,0.035) 3px, rgba(160,140,100,0.035) 4px),
    repeating-linear-gradient(0deg,  transparent, transparent 3px, rgba(160,140,100,0.035) 3px, rgba(160,140,100,0.035) 4px);
  pointer-events: none;
  z-index: 0;
}

/* ── PAGE FRAME ── */
.page-frame {
  position: fixed; inset: 18px;
  border: 1.5px solid rgba(28,18,9,0.2);
  pointer-events: none; z-index: 200;
}
.page-frame::after {
  content: '';
  position: absolute; inset: 6px;
  border: 0.5px solid rgba(28,18,9,0.08);
}

/* ── CORNER ORNAMENTS ── */
/* Each corner is an L-shape + dot, drawn correctly per corner */
.corner {
  position: fixed; z-index: 201;
  width: 22px; height: 22px;
  pointer-events: none;
}
.corner.tl { top: 12px;    left: 12px;    }
.corner.tr { top: 12px;    right: 12px;   }
.corner.bl { bottom: 12px; left: 12px;    }
.corner.br { bottom: 12px; right: 12px;   }

/* ── SCREENS ── */
.screen { display: none !important; position: relative; z-index: 1; }
.screen.active { display: block !important; }
#s-intro.active  { display: flex !important; }
#s-transition.active { display: flex !important; }

/* ══════════ INTRO ══════════ */
#s-intro {
  min-height: 100vh;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 64px 24px 80px;
  text-align: center;
  display: flex;
}
#s-intro.active { display: flex; }

.intro-eyebrow {
  font-size: 0.58rem;
  letter-spacing: 0.38em;
  text-transform: uppercase;
  opacity: 0.38;
  margin-bottom: 1.6rem;
}

/* wheel */
.wheel-wrap {
  width: 200px; height: 200px;
  margin: 0 auto 2rem;
  cursor: pointer;
  flex-shrink: 0;
}
.wheel-svg {
  width: 200px; height: 200px;
  display: block;
  animation: spin 26s linear infinite;
}
.wheel-wrap:hover .wheel-svg { animation-duration: 4s; }
@keyframes spin { to { transform: rotate(360deg); } }

/* title */
.intro-title {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  font-size: clamp(3.5rem, 14vw, 8rem);
  font-weight: 900;
  line-height: 0.92;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}
.intro-title .small {
  display: block;
  font-family: 'Barlow', sans-serif;
  font-size: 0.22em;
  font-weight: 500;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  opacity: 0.38;
  margin-bottom: 0.5em;
}
.intro-title .accent { color: var(--red); }

/* deco rule */
.deco-rule {
  display: flex; align-items: center; gap: 10px;
  width: 180px; margin: 1.4rem auto 1.6rem;
}
.deco-rule::before,
.deco-rule::after {
  content: ''; flex: 1; height: 1px;
  background: var(--ink); opacity: 0.2;
}
.deco-glyph { color: var(--red); font-size: 1rem; opacity: 0.65; line-height: 1; }

/* type chips */
.type-strip {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 5px 8px; margin-bottom: 2.2rem;
}
.type-chip {
  font-size: 0.56rem; letter-spacing: 0.18em; text-transform: uppercase;
  border: 1px solid rgba(28,18,9,0.22); padding: 0.22rem 0.7rem;
  opacity: 0.42;
}

/* begin button */
.begin-btn {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  font-size: 1rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--paper); background: var(--ink);
  border: none; padding: 0.8rem 2.8rem;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}
.begin-btn:hover { background: var(--red); transform: translateY(-2px); }

/* ══════════ QUIZ ══════════ */
#s-quiz { min-height: 100vh; padding: 48px 24px 80px; }
.quiz-inner { max-width: 540px; margin: 0 auto; }

.quiz-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 3rem;
}
.q-counter {
  font-size: 0.6rem; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.32;
}
.prog-dots { display: flex; gap: 5px; align-items: center; }
.prog-dot {
  width: 6px; height: 6px;
  border: 1px solid rgba(28,18,9,0.28);
  border-radius: 50%;
  transition: all 0.22s;
}
.prog-dot.done  { background: var(--ink); border-color: var(--ink); }
.prog-dot.active { background: var(--red); border-color: var(--red); width: 8px; height: 8px; }

.q-wrap { position: relative; margin-bottom: 2rem; }
.q-tag {
  font-size: 0.55rem; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--red); opacity: 0.68; margin-bottom: 0.6rem;
}
.q-text {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  font-size: clamp(1.5rem, 4vw, 2.2rem);
  font-weight: 700;
  font-style: italic;
  line-height: 1.2;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.q-rule { width: 32px; height: 1.5px; background: var(--red); margin: 1rem 0; opacity: 0.5; }
.q-num {
  position: absolute; top: -1rem; right: 0;
  font-size: 4.5rem; font-weight: 700; line-height: 1;
  color: var(--ink); opacity: 0.05;
  pointer-events: none; user-select: none;
}

.options { display: flex; flex-direction: column; }
.opt {
  background: transparent;
  border: none;
  border-top: 0.5px solid rgba(28,18,9,0.1);
  color: var(--ink);
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.88rem; line-height: 1.62;
  padding: 0.85rem 2rem 0.85rem 1.1rem;
  text-align: left; cursor: pointer; width: 100%;
  opacity: 0.65; position: relative;
  transition: padding-left 0.16s, opacity 0.16s, color 0.16s;
}
.opt:last-child { border-bottom: 0.5px solid rgba(28,18,9,0.1); }
.opt::before {
  content: ''; position: absolute;
  left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 0; background: var(--red);
  transition: height 0.16s;
}
.opt:hover { opacity: 1; padding-left: 1.5rem; }
.opt:hover::before { height: 52%; }
.opt.selected { opacity: 1; padding-left: 1.5rem; color: var(--red); font-weight: 700; }
.opt.selected::before { height: 62%; }
.opt.selected::after {
  content: '☛'; position: absolute; right: 0.5rem; top: 50%;
  transform: translateY(-50%); font-size: 0.72rem; color: var(--red);
}

.nav-row { display: flex; align-items: center; justify-content: space-between; margin-top: 2rem; }
.nav-hint { font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.2; }
.next-btn {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  font-size: 0.9rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--paper); background: var(--ink);
  border: none; padding: 0.65rem 1.8rem; cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}
.next-btn:disabled { opacity: 0.18; cursor: default; pointer-events: none; }
.next-btn:not(:disabled):hover { background: var(--red); transform: translateY(-1px); }

/* ══════════ TRANSITION ══════════ */
#s-transition {
  min-height: 100vh;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 1.6rem;
  text-align: center; padding: 2rem;
}
#s-transition.active { display: flex; }

.trans-wheel { width: 80px; height: 80px; animation: spin 1.8s linear infinite; display: block; }
.trans-text { font-size: 0.58rem; letter-spacing: 0.34em; text-transform: uppercase; opacity: 0.3; }

/* ══════════ RESULT ══════════ */
#s-result { min-height: 100vh; padding: 52px 24px 100px; }
.result-inner { max-width: 540px; margin: 0 auto; }

.result-band { height: 5px; margin-bottom: 3rem; display: flex; }
.result-band-seg { flex: 1; }

.result-eyebrow {
  font-size: 0.56rem; letter-spacing: 0.32em; text-transform: uppercase; opacity: 0.32; margin-bottom: 0.4rem;
}
.result-name {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  font-size: clamp(3.5rem, 12vw, 7rem);
  font-weight: 900;
  line-height: 0.88;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  margin-bottom: 0.3rem;
}
.result-secondary { font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.32; margin-bottom: 1.3rem; }
.result-tagline {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.15rem; font-weight: 700; font-style: italic;
  line-height: 1.4; opacity: 0.6; margin-bottom: 2rem; max-width: 420px;
  text-transform: uppercase; letter-spacing: 0.02em;
}

.blend-heading { font-size: 0.54rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.28; margin-bottom: 0.85rem; }
.blend-rows { margin-bottom: 2rem; }
.blend-row { display: flex; align-items: center; gap: 12px; margin-bottom: 7px; }
.blend-name { font-size: 0.56rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.42; min-width: 72px; }
.blend-track { flex: 1; height: 2px; background: rgba(28,18,9,0.1); }
.blend-bar { height: 2px; transition: width 1.1s cubic-bezier(0.16,1,0.3,1); }
.blend-pct { font-size: 0.56rem; opacity: 0.36; min-width: 26px; text-align: right; }

.result-rule { width: 28px; height: 1px; background: var(--ink); opacity: 0.15; margin: 1.6rem 0; }

.result-desc { font-size: 0.84rem; line-height: 1.9; opacity: 0.62; margin-bottom: 2.4rem; }

.shadow-outer {
  border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
  padding: 1.3rem 0; margin-bottom: 2.4rem; position: relative;
}
.shadow-outer::before {
  content: 'shadow';
  position: absolute; top: -0.48rem; left: 0;
  font-size: 0.5rem; letter-spacing: 0.26em; text-transform: uppercase;
  background: var(--paper); padding-right: 8px; opacity: 0.28;
}
.shadow-name {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  font-size: 1.6rem; font-weight: 800; text-transform: uppercase;
  color: var(--red); margin-bottom: 0.4rem; letter-spacing: 0.02em;
}
.shadow-desc { font-size: 0.82rem; line-height: 1.85; opacity: 0.6; font-style: italic; }

.restart-btn {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  font-size: 0.85rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
  background: transparent; border: 1px solid rgba(28,18,9,0.2);
  color: var(--ink); padding: 0.55rem 1.3rem; cursor: pointer; opacity: 0.42;
  transition: opacity 0.2s, border-color 0.2s, color 0.2s;
}
.restart-btn:hover { opacity: 1; border-color: var(--red); color: var(--red); }

/* animations */
@keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fi { animation: up 0.28s ease both; }

@media (max-width: 480px) {
  .intro-title { font-size: 2.2rem; }
  .result-name  { font-size: 2.4rem; }
}
</style>
</head>

  <h1 class="intro-title">

  <p class="trans-text">reading the pattern</p>
</div>

<!-- ══ RESULT ══ -->
<div class="screen" id="s-result">
  <div class="result-inner">
    <div class="result-band" id="r-band"></div>
    <div class="result-eyebrow">your archetype</div>
    <div class="result-name"      id="r-name"></div>
    <div class="result-secondary" id="r-secondary"></div>
    <div class="result-tagline"   id="r-tagline"></div>
    <div class="blend-heading">composition</div>
    <div class="blend-rows"       id="r-bars"></div>
    <div class="result-rule"></div>
    <div class="result-desc"      id="r-desc"></div>
    <div class="shadow-outer">
      <div class="shadow-name" id="r-shadow-name"></div>
      <div class="shadow-desc" id="r-shadow-desc"></div>
    </div>
    <button class="restart-btn" onclick="restart()">☚ begin again</button>
  </div>
</div>

<script>
const TYPES  = ['creator','preserver','reflector','mover','tender','seeker'];
const ROMAN  = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const COLORS = {
  creator:'#d4342a', preserver:'#3a7a2a', reflector:'#2845a0',
  mover:'#e8761a',   tender:'#c42070',    seeker:'#d4a017'
};
const TYPE_DATA = {
  creator:{   label:'Creator',   tagline:"You bring things into being that didn't exist before.",      desc:"You think in possibilities and futures. You're driven by the need to make, build, disrupt — not for its own sake, but because the current version of things isn't good enough. You tolerate uncertainty better than most, and you often leave people slightly breathless trying to keep up.",                                                                                                         shadow_name:'The Destroyer', shadow:"Your drive to create can flatten what already exists — relationships, structures, traditions — without noticing. You may leave wreckage behind you and call it progress. The things you break aren't always yours to break." },
  preserver:{ label:'Preserver', tagline:'You hold things together that would otherwise fall apart.',    desc:"You understand that most of what's valuable was built slowly, over time, and can be lost quickly. You resist change that hasn't been thought through. You are the continuity others take for granted — the reason things still work, still mean something, still hold.",                                                                                                                        shadow_name:'The Decayer',   shadow:"Held too tightly, preservation becomes resistance. You may protect things past their usefulness, or confuse familiarity with value. Stagnation can look a lot like stability from the inside — until it doesn't." },
  reflector:{ label:'Reflector', tagline:'You process the world deeply before responding to it.',        desc:"You observe more than you act. You find meaning in what others overlook. You need time and space to think, and your insights often arrive after everyone else has moved on — and are often better for it. You are the still water that shows the sky.",                                                                                                                                     shadow_name:'The Consumer',  shadow:"Reflection without action can become a way of avoiding the world. You may absorb experiences, ideas, and people without giving much back — mistaking depth of feeling for depth of contribution. The archive grows; the output doesn't." },
  mover:{     label:'Mover',     tagline:'You generate momentum — in yourself and in others.',           desc:"You are energised by progress, pace, and forward motion. You don't wait for permission and you find inaction physically uncomfortable. People around you get swept up — sometimes gratefully, sometimes not. You are at your best when there's something worth running toward.",                                                                                                          shadow_name:'The Agitator', shadow:"Speed without direction is just disruption. You can bulldoze slower people, mistake urgency for importance, and leave half-finished things in your wake. Not everything needs to move faster. Some things need you to stop." },
  tender:{    label:'Tender',    tagline:'You are most alive when someone else is being held.',          desc:"You notice when people are struggling before they say anything. You create safety, warmth, and belonging — often invisibly. Your presence changes the emotional temperature of a room, and people remember how you made them feel long after they forget what you said.",                                                                                                             shadow_name:'The Enabler',  shadow:"Care without boundaries becomes self-erasure. You may hold others up at the cost of your own foundation, or protect people from consequences that would help them grow. Tenderness can become a quiet way of controlling through closeness." },
  seeker:{    label:'Seeker',    tagline:'You follow the question wherever it leads.',                    desc:"You are driven by curiosity more than answers. You change your mind readily, find the edges of things more interesting than the centre, and feel most alive when you're in unfamiliar territory — intellectually or literally. You have a gift for beginnings.",                                                                                                                    shadow_name:'The Escapist', shadow:"The horizon is always more interesting than where you've arrived. You may flee depth for novelty, commitment for possibility, and real relationships for the idea of them. Seeking can be a beautiful way of never being found." }
};

const QUESTIONS = [
  { text:"You find an old library that only you can see. It has exactly one section. Which section is it?", tag:'whimsical', opts:[{text:"Blueprints — every great thing that was ever imagined but never built.",w:[4,0,0,1,0,1]},{text:"Endangered things — languages, recipes, traditions on the edge of vanishing.",w:[0,4,0,0,1,0]},{text:"Inner lives — diaries, letters, the thoughts people never said out loud.",w:[0,0,3,0,2,1]},{text:"Elsewhere — every place in the world you haven't been yet.",w:[0,0,0,1,0,4]}]},
  { text:"What do you find hardest to forgive in other people?", tag:'reflective', opts:[{text:"Wasted potential. People who could do more and don't.",w:[3,0,1,2,0,0]},{text:"Carelessness with things that took a long time to build.",w:[0,4,0,0,1,0]},{text:"Shallowness. People who never think about why they do what they do.",w:[0,0,4,0,0,2]},{text:"Passivity. Waiting for someone else to fix things.",w:[1,0,0,4,0,0]},{text:"Cruelty. Especially the casual kind that people don't notice.",w:[0,0,1,0,4,0]},{text:"Certainty. People who stopped being curious.",w:[1,0,1,0,0,4]}]},
  { text:"You are a weather pattern. Which one?", tag:'whimsical', opts:[{text:"A thunderstorm — dramatic arrival, clears the air, moves on.",w:[3,0,0,3,0,0]},{text:"A long mild season — dependable, nourishing, easy to forget until it's gone.",w:[0,4,0,0,2,0]},{text:"Morning fog — makes familiar things strange, burns off slowly.",w:[0,0,4,0,0,1]},{text:"A warm wind from somewhere else — carries a smell you can't quite place.",w:[0,0,1,0,0,4]},{text:"Steady rain — present, gentle, the kind that fills rivers slowly.",w:[0,1,0,0,4,0]}]},
  { text:"You're reading about a civilisation that collapsed 2,000 years ago. What pulls your attention?", tag:'reflective', opts:[{text:"What they invented. What they imagined into existence.",w:[4,0,0,0,0,1]},{text:"What they preserved — rituals, language, ways of living together.",w:[0,4,0,0,1,0]},{text:"What it felt like to live through the collapse. The ordinary people.",w:[0,0,3,0,2,0]},{text:"What caused it. The tipping point no one saw coming.",w:[1,1,1,1,0,2]}]},
  { text:"If your life had a recurring flaw — something that shows up in different forms — what would it most likely be?", tag:'reflective', opts:[{text:"Starting things I don't finish.",w:[3,0,0,2,0,1]},{text:"Holding on too long to things that have already ended.",w:[0,4,0,0,1,0]},{text:"Living in my head instead of the world.",w:[0,0,4,0,0,1]},{text:"Moving so fast I miss what's right in front of me.",w:[0,0,0,4,0,1]},{text:"Losing myself in other people's needs.",w:[0,0,0,0,4,1]},{text:"Never feeling like I've found the right thing yet.",w:[0,0,1,0,0,4]}]},
  { text:"You inherit a large, rambling house. Your first instinct is...", tag:'whimsical', opts:[{text:"Knock out a wall. Rethink the whole layout. It could be something better.",w:[4,0,0,2,0,0]},{text:"Go through every drawer and cupboard. Learn who lived here before.",w:[0,3,2,0,0,1]},{text:"Sit in each room alone for a while before deciding anything.",w:[0,0,4,0,0,1]},{text:"Fill it with people immediately. It's too quiet.",w:[0,0,0,2,3,0]},{text:"Find the room you'd never use — and go there first.",w:[0,0,1,0,0,4]}]},
  { text:"An institution you care about is changing in ways you don't like. What do you do?", tag:'situational', opts:[{text:"Build something new alongside it — make the old version irrelevant.",w:[4,0,0,1,0,0]},{text:"Work from within to slow the change and protect what matters.",w:[0,4,0,0,1,0]},{text:"Write or speak about what's being lost. Bear witness.",w:[0,1,3,0,0,1]},{text:"Organise people. Make noise. Force the conversation.",w:[0,0,0,4,1,0]}]},
  { text:"What kind of conversation leaves you feeling most alive?", tag:'reflective', opts:[{text:"One where we figured something out that neither of us could alone.",w:[3,0,1,1,0,1]},{text:"One where someone shared something they'd never told anyone.",w:[0,0,2,0,4,0]},{text:"One that went somewhere I didn't expect. That changed my mind.",w:[1,0,2,0,0,3]},{text:"One that turned into a plan. That ended with us doing something.",w:[1,0,0,4,0,1]}]},
  { text:"You are given a single object to carry for the rest of your life. You choose...", tag:'whimsical', opts:[{text:"A blank notebook — for everything you're still going to make.",w:[4,0,1,0,0,1]},{text:"A photograph of something you never want to forget.",w:[0,4,0,0,2,0]},{text:"A compass — not for direction exactly, but for orientation.",w:[0,0,0,2,0,4]},{text:"A key. You'll find the door eventually.",w:[0,0,2,1,0,3]},{text:"Something that belonged to someone you love.",w:[0,2,1,0,4,0]},{text:"Nothing. You'd rather travel light.",w:[1,0,0,3,0,2]}]},
  { text:"Which of these feels most true about you?", tag:'reflective', opts:[{text:"I am always working on something that doesn't exist yet.",w:[4,0,0,1,0,1]},{text:"I am a keeper of things — stories, people, traditions, promises.",w:[0,4,0,0,2,0]},{text:"I process the world more than I act on it — and that's mostly okay.",w:[0,0,4,0,0,1]},{text:"I generate energy in a room. Things move differently when I'm involved.",w:[1,0,0,4,0,0]},{text:"People come to me when they're struggling. I don't mind that.",w:[0,0,0,0,4,0]},{text:"I am always mid-question. I don't stay anywhere long enough to call it home.",w:[0,0,1,1,0,4]}]},
  { text:"The world is ending in 100 years. What do you spend your remaining time doing?", tag:'reflective', opts:[{text:"Trying to stop it. Or build something that survives it.",w:[4,0,0,2,0,0]},{text:"Preserving everything worth preserving. Making sure it's recorded.",w:[0,4,1,0,0,0]},{text:"Trying to understand it. What led here. What it means.",w:[0,0,4,0,0,2]},{text:"Making the most of the time left. Events, experiences, people.",w:[0,0,0,3,0,2]},{text:"Making sure the people around me are okay. Being present for them.",w:[0,0,0,0,4,0]}]},
  { text:"What do you most want people to say about you after you're gone?", tag:'reflective', opts:[{text:"They made something that mattered. The world is different because of them.",w:[4,0,0,1,0,0]},{text:"They held things together. They kept what was good.",w:[0,4,0,0,1,0]},{text:"They understood things deeply. They saw what others missed.",w:[0,0,4,0,0,1]},{text:"They made things happen. They got people moving.",w:[0,0,0,4,0,0]},{text:"They made people feel less alone.",w:[0,0,0,0,4,0]},{text:"They never stopped asking questions. They were always becoming.",w:[0,0,1,0,0,4]}]}
];

let current = 0;
let answers  = new Array(12).fill(null);

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function startQuiz() {
  show('s-quiz');
  buildDots();
  renderQ();
}

function buildDots() {
  const w = document.getElementById('prog-dots');
  w.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const d = document.createElement('div');
    d.className = 'prog-dot' + (i === 0 ? ' active' : '');
    d.id = 'dot-' + i;
    w.appendChild(d);
  }
}

function updateDots() {
  for (let i = 0; i < 12; i++) {
    const d = document.getElementById('dot-' + i);
    if (!d) continue;
    d.className = 'prog-dot' + (i < current ? ' done' : i === current ? ' active' : '');
  }
}

function renderQ() {
  const q = QUESTIONS[current];
  document.getElementById('q-counter').textContent = ROMAN[current] + ' of XII';
  document.getElementById('q-tag').textContent  = q.tag;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('q-num').textContent  = current + 1;
  updateDots();

  const btn = document.getElementById('next-btn');
  btn.disabled    = answers[current] === null;
  btn.textContent = current === 11 ? 'Reveal →' : 'Continue →';

  const wrap = document.getElementById('options');
  wrap.innerHTML  = '';
  q.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className          = 'opt fi' + (answers[current] === i ? ' selected' : '');
    b.style.animationDelay = (i * 0.055) + 's';
    b.textContent        = o.text;
    b.onclick            = () => selectOpt(i);
    wrap.appendChild(b);
  });
}

function selectOpt(i) {
  answers[current] = i;
  document.querySelectorAll('.opt').forEach((b, j) => b.classList.toggle('selected', j === i));
  document.getElementById('next-btn').disabled = false;
}

function nextQ() {
  if (current === 11) { show('s-transition'); setTimeout(showResult, 1900); return; }
  current++;
  renderQ();
}

function showResult() {
  const scores = { creator:0, preserver:0, reflector:0, mover:0, tender:0, seeker:0 };
  QUESTIONS.forEach((q, qi) => {
    const ai = answers[qi];
    if (ai === null) return;
    q.opts[ai].w.forEach((v, ti) => { scores[TYPES[ti]] += v; });
  });
  const total  = Object.values(scores).reduce((a, b) => a + b, 0) || 1;
  const pcts   = {};
  TYPES.forEach(t => pcts[t] = Math.round(scores[t] / total * 100));
  const sorted  = TYPES.slice().sort((a, b) => pcts[b] - pcts[a]);
  const primary = sorted[0], secondary = sorted[1];
  const d       = TYPE_DATA[primary];

  // colour band
  const band = document.getElementById('r-band');
  band.innerHTML = '';
  sorted.forEach(t => {
    if (!pcts[t]) return;
    const seg = document.createElement('div');
    seg.className        = 'result-band-seg';
    seg.style.background = COLORS[t];
    seg.style.flex       = pcts[t];
    band.appendChild(seg);
  });

  document.getElementById('r-name').textContent      = d.label;
  document.getElementById('r-secondary').textContent = 'with traces of the ' + TYPE_DATA[secondary].label;
  document.getElementById('r-tagline').textContent   = d.tagline;
  document.getElementById('r-desc').textContent      = d.desc + ' Your secondary current — the ' + TYPE_DATA[secondary].label.toLowerCase() + ' — runs underneath: ' + TYPE_DATA[secondary].tagline.toLowerCase();
  document.getElementById('r-shadow-name').textContent = d.shadow_name;
  document.getElementById('r-shadow-desc').textContent = d.shadow;

  const barsWrap = document.getElementById('r-bars');
  barsWrap.innerHTML = '';
  sorted.forEach(t => {
    if (!pcts[t]) return;
    const row = document.createElement('div');
    row.className = 'blend-row';
    row.innerHTML = `<span class="blend-name">${TYPE_DATA[t].label}</span><div class="blend-track"><div class="blend-bar" style="width:0%;background:${COLORS[t]}" data-pct="${pcts[t]}"></div></div><span class="blend-pct">${pcts[t]}%</span>`;
    barsWrap.appendChild(row);
  });

  show('s-result');
  setTimeout(() => {
    document.querySelectorAll('.blend-bar').forEach(el => { el.style.width = el.dataset.pct + '%'; });
  }, 150);
}

function restart() {
  current = 0;
  answers = new Array(12).fill(null);
  show('s-intro');
}
</script>
