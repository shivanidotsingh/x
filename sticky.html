*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:#c3cfd6;
  -webkit-font-smoothing:antialiased;
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── full-bleed view ─────────────────────────────────── */
.view{
  position:fixed;inset:-30px;z-index:0;
  filter:blur(var(--view-blur)) saturate(.92);
  background-image:var(--view-image);background-size:cover;background-position:center;
}
.view video,.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ── surface where notes land ────────────────────────── */
.glass{position:fixed;inset:0;z-index:1}
body.holding{cursor:none}

/* ── a sticky note ───────────────────────────────────── */
.note{
  position:absolute;width:var(--note-size);height:var(--note-size);
  background:var(--c);
  box-shadow:0 5px 12px -6px rgba(28,28,38,.2);
  will-change:transform;
}
.note .txt{
  position:absolute;inset:8% 7%;
  display:flex;align-items:center;overflow:hidden;
  font-weight:700;line-height:1.18;letter-spacing:-.015em;
}
.note .txt span{display:block;width:100%}

.placed{transition:box-shadow .16s ease}
.placed:hover,.placed:focus-visible{
  z-index:900 !important;
  box-shadow:0 12px 22px -8px rgba(28,28,38,.22);outline:none;
}
.placed:focus-visible{box-shadow:0 0 0 3px rgba(38,38,44,.7),0 12px 22px -8px rgba(28,28,38,.22)}

.held{
  position:fixed;left:0;top:0;z-index:1000;pointer-events:none;
  box-shadow:0 16px 30px -12px rgba(28,28,38,.21);
}

/* ── interface: one arrow ───────────────────────────── */

.again{
  position:fixed;top:26px;right:28px;z-index:1200;
  width:34px;height:34px;display:grid;place-items:center;
  background:none;border:0;cursor:pointer;color:rgba(34,34,40,.8);
  filter:drop-shadow(0 1px 5px rgba(255,255,255,.85));
  opacity:0;pointer-events:none;transition:opacity .45s ease,color .2s ease,transform .3s ease;
}
.again.on{opacity:1;pointer-events:auto}
.again:hover{color:var(--ink);transform:rotate(-40deg)}
.again:focus-visible{outline:2px solid rgba(34,34,40,.85);outline-offset:3px;border-radius:3px}
.again svg{width:24px;height:24px;display:block}

@media (max-width:760px){
  .again{top:16px;right:16px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<h1 class="sr">the point of a sticky note</h1>

<div class="view" id="view">
  <!-- VIDEO: uncomment this and set --view-image to none.
  <video autoplay muted loop playsinline src="view.mp4"></video>
  -->
</div>

<div class="glass" id="glass"></div>

<button class="again" id="again" aria-label="Start again" title="Start again">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/>
    <path d="M20.6 4.2v4.6H16"/>
  </svg>
</button>

<script>
const LINES = [
  "the point of a sticky note",
  "is not the theatre of co-creation",
  "but the beauty of concision.",
  "it\u2019s an invitation to sharpen your thinking",
  "to distill an idea to it\u2019s essence",
  "to draw attention to what is necessary,",
  "and allow each word to hold its weight;",
  "it signals a synthesis of thought",
  "a regard for borrowed attention.",
  "a sticky note lives deep in the sea of context",
  "it\u2019s a point within a larger discussion,",
  "a cell of an idea in the hive mind.",
  "outside the room, it may as well be poetry."
];

const COLOURS = ['#FFFF99', '#FFB3D9', '#B3FFB3', '#B3D9FF'];

/* Deal colours from a reshuffled bag: every four notes uses all four,
   the order is never the same twice, and one never follows itself. */
let bag = [], lastColour = null;
function nextColour(){
  if (!bag.length){
    bag = COLOURS.slice();
    for (let i = bag.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
    }
    if (bag[0] === lastColour){ const t = bag[0]; bag[0] = bag[1]; bag[1] = t; }
  }
  lastColour = bag.shift();
  return lastColour;
}

const glass = document.getElementById('glass');
const again = document.getElementById('again');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let idx = 0, held = null, placed = [], running = false;

function size(){
  return Math.round(Math.min(176, innerWidth * 0.36, innerHeight * 0.26));
}
function applySize(){
  document.documentElement.style.setProperty('--note-size', size() + 'px');
}
applySize();

function makeNote(text){
  const n = document.createElement('div');
  n.className = 'note';
  n.style.setProperty('--c', nextColour());
  const t = document.createElement('div'); t.className = 'txt';
  const s = document.createElement('span'); s.textContent = text;
  t.appendChild(s); n.appendChild(t);
  return n;
}
/* One size for all thirteen notes: the largest that the longest
   line can carry. Measured once, remeasured on resize. */
let uniformPx = null;
function measure(){
  const probe = document.createElement('div');
  probe.className = 'note';
  probe.style.cssText = 'left:-9999px;top:0;visibility:hidden';
  const t = document.createElement('div'); t.className = 'txt';
  const sp = document.createElement('span');
  t.appendChild(sp); probe.appendChild(t);
  document.body.appendChild(probe);

  let px = size() * 0.24, guard = 90;
  while (guard-- > 0 && px > 8){
    t.style.fontSize = px + 'px';
    const fits = LINES.every(function(l){
      sp.textContent = l;
      return sp.offsetHeight <= t.clientHeight;
    });
    if (fits) break;
    px -= 0.5;
  }
  probe.remove();
  uniformPx = px;
}
function fit(el){
  if (uniformPx === null) measure();
  el.querySelector('.txt').style.fontSize = uniformPx + 'px';
}

/* ── follow the cursor ───────────────────────────────── */
const cur = {x: innerWidth / 2, y: innerHeight / 2};
const tgt = {x: cur.x, y: cur.y};
let tilt = 0;

function loop(){
  if (!held){ running = false; return; }
  const k = reduce ? 1 : 0.26;
  const dx = tgt.x - cur.x;
  cur.x += dx * k;
  cur.y += (tgt.y - cur.y) * k;
  tilt += (Math.max(-8, Math.min(8, dx * 0.07)) - tilt) * 0.2;
  held.style.transform =
    'translate3d(' + cur.x + 'px, ' + cur.y + 'px, 0) translate(-50%, -12px) rotate(' + tilt.toFixed(2) + 'deg)';
  requestAnimationFrame(loop);
}
function run(){ if (!running){ running = true; requestAnimationFrame(loop); } }

function take(){
  if (held || idx >= LINES.length) return;
  held = makeNote(LINES[idx]);
  held.classList.add('held');
  document.body.appendChild(held);
  fit(held);
  document.body.classList.add('holding');
  run();
}

/* ── placing ─────────────────────────────────────────── */
function overlap(a, b, s){
  const ox = Math.max(0, Math.min(a.x + s, b.x + s) - Math.max(a.x, b.x));
  const oy = Math.max(0, Math.min(a.y + s, b.y + s) - Math.max(a.y, b.y));
  return (ox * oy) / (s * s);
}
function freeSpot(x, y, s){
  const clamp = (p) => ({
    x: Math.max(8, Math.min(innerWidth - s - 8, p.x)),
    y: Math.max(8, Math.min(innerHeight - s - 8, p.y))
  });
  let p = clamp({x: x, y: y});
  const worst = () => placed.reduce((m, n) => Math.max(m, overlap(p, n, s)), 0);
  if (worst() <= 0.14) return p;
  for (let r = 12; r <= s * 1.6; r += 12){
    for (let a = 0; a < 12; a++){
      const th = (a / 12) * Math.PI * 2;
      p = clamp({x: x + Math.cos(th) * r, y: y + Math.sin(th) * r});
      if (worst() <= 0.14) return p;
    }
  }
  return clamp({x: x, y: y});
}

function stick(n, x, y, angle){
  n.classList.remove('held');
  n.classList.add('placed');
  n.style.left = x + 'px';
  n.style.top  = y + 'px';
  n.style.zIndex = 10 + placed.length;
  n.style.transform = 'rotate(' + angle.toFixed(2) + 'deg)';
  n.tabIndex = 0;
  glass.appendChild(n);
  placed.push({el: n, x: x, y: y});
}

function place(px, py){
  if (!held) return;
  const s = size();
  const p = freeSpot(px - s / 2, py - 12, s);
  stick(held, p.x, p.y, Math.random() * 6 - 3);

  held = null; running = false;
  document.body.classList.remove('holding');
  again.classList.add('on');
  idx++;

  if (idx < LINES.length) setTimeout(take, reduce ? 0 : 150);
}

/* ── input ───────────────────────────────────────────── */
addEventListener('pointermove', function(e){
  if (!held) return;
  tgt.x = e.clientX; tgt.y = e.clientY; run();
});
glass.addEventListener('pointerdown', function(e){
  if (!held) return;
  cur.x = e.clientX; cur.y = e.clientY;
  place(e.clientX, e.clientY);
});

addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (document.activeElement === again) return;
  if (!held) return;
  e.preventDefault();
  const col = placed.length % 4, row = Math.floor(placed.length / 4) % 3;
  place((col + 0.5) * (innerWidth / 4), (row + 0.45) * (innerHeight / 3));
});

addEventListener('resize', function(){
  applySize();
  measure();
  placed.forEach(function(n){ fit(n.el); });
  if (held) fit(held);
});

/* The opening line is already on the glass when you arrive —
   it reads as the title, and shows you what you're about to do. */
function seed(){
  const n = makeNote(LINES[0]);
  glass.appendChild(n);
  fit(n);
  stick(n,
    Math.max(20, Math.round(innerWidth * 0.07)),
    Math.max(20, Math.round(innerHeight * 0.11)),
    -2.4);
  idx = 1;
  take();
}

again.addEventListener('click', function(){
  placed.forEach(function(n){ n.el.remove(); });
  placed = [];
  if (held){ held.remove(); held = null; running = false; }
  bag = []; lastColour = null;
  again.classList.remove('on');
  document.body.classList.remove('holding');
  seed();
});

seed();
</script>
</body>
</html>
