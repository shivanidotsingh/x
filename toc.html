<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where do I fit?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border: 1px solid #ddd;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #1CABE2;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }

        /* Progress */
        .progress {
            margin-bottom: 40px;
        }

        .progress-steps {
            display: flex;
            gap: 8px;
        }

        .progress-step {
            flex: 1;
            position: relative;
        }

        .progress-bar-line {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            transition: background 0.3s ease;
        }

        .progress-step.active .progress-bar-line,
        .progress-step.completed .progress-bar-line {
            background: #1CABE2;
        }

        .step-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
            margin-top: 8px;
            text-align: center;
        }

        .progress-step.active .step-label {
            color: #1CABE2;
            font-weight: 600;
        }

        .progress-step.completed .step-label {
            color: #666;
        }

        /* Questions */
        .question-section {
            margin-bottom: 40px;
        }

        .question-section.hidden {
            display: none;
        }

        .question-label {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #333;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .option:hover {
            border-color: #1CABE2;
            background: #f8fcff;
        }

        .option.selected {
            border-color: #1CABE2;
            background: #e6f7ff;
        }

        .option-title {
            font-weight: 600;
            margin-bottom: 4px;
            color: #333;
        }

        .option-desc {
            font-size: 14px;
            color: #666;
        }

        /* Lens panel (appears under the Accelerate card) */
        .lens-panel {
            display: none;
            margin: -4px 0 4px 20px;
            padding-left: 16px;
            border-left: 3px solid #1CABE2;
        }

        .lens-panel-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .lens-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Chips (lens and activities) */
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            font-family: inherit;
            font-size: 14px;
            text-align: left;
            padding: 8px 14px;
            border: 1px solid #e0e0e0;
            background: white;
            color: #333;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .chip:hover {
            border-color: #1CABE2;
            background: #f8fcff;
        }

        .chip.selected {
            border-color: #1CABE2;
            background: #e6f7ff;
            color: #1CABE2;
            font-weight: 600;
        }

        /* Once the maximum is picked, fade the rest */
        .chips.maxed .chip:not(.selected) {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Results */
        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .results-header {
            background: white;
            padding: 0 0 30px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .session-goal {
            font-size: 28px;
            font-weight: 600;
            color: #333;
            line-height: 1.4;
        }

        .session-goal .highlight {
            color: #1CABE2;
            font-weight: 600;
        }

        .session-sub {
            font-size: 18px;
            font-weight: 400;
            color: #666;
            line-height: 1.5;
            margin-top: 20px;
        }

        .session-sub .highlight {
            color: #1CABE2;
            font-weight: 600;
        }

        /* Buttons */
        .button {
            background: #1CABE2;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .button:hover {
            background: #1799c7;
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .button-secondary {
            background: white;
            color: #1CABE2;
            border: 2px solid #1CABE2;
            margin-right: 12px;
        }

        .button-secondary:hover {
            background: #f8fcff;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 24px;
            }

            h1 {
                font-size: 24px;
            }

            .session-goal {
                font-size: 22px;
            }

            .session-sub {
                font-size: 16px;
            }

            .progress-steps {
                gap: 4px;
            }

            .step-label {
                font-size: 9px;
                margin-top: 6px;
            }

            .actions {
                flex-direction: column;
            }

            .button-secondary {
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Where do I fit?</h1>
        <p class="subtitle">Place your work in our theory of change.</p>

        <div class="progress">
            <div class="progress-steps">
                <div class="progress-step active" id="step1">
                    <div class="progress-bar-line"></div>
                    <div class="step-label">Team</div>
                </div>
                <div class="progress-step" id="step2">
                    <div class="progress-bar-line"></div>
                    <div class="step-label">Area</div>
                </div>
                <div class="progress-step" id="step3">
                    <div class="progress-bar-line"></div>
                    <div class="step-label">Pathway</div>
                </div>
                <div class="progress-step" id="step4">
                    <div class="progress-bar-line"></div>
                    <div class="step-label">Focus</div>
                </div>
            </div>
        </div>

        <!-- Question 1: Team -->
        <div class="question-section" id="q1">
            <div class="question-label">1. Which team do you work in?</div>
            <div class="options" id="teamOptions"></div>
        </div>

        <!-- Question 2: Area (depends on team) -->
        <div class="question-section hidden" id="q2">
            <div class="question-label" id="areaLabel"></div>
            <div class="options" id="areaOptions"></div>
        </div>

        <!-- Question 3: Pathway (lens appears under Accelerate) -->
        <div class="question-section hidden" id="q3">
            <div class="question-label">3. Innovation advances results for children. Which of these is closest to the work you do?</div>
            <div class="options" id="pathwayOptions"></div>
        </div>

        <!-- Question 4: Activities (same options for everyone, max 3) -->
        <div class="question-section hidden" id="q4">
            <div class="question-label">4. Which of these describe your work? (pick up to 3)</div>
            <div class="chips" id="activityChips"></div>

            <div class="actions">
                <button class="button" id="buildBtn" onclick="showResults()" disabled>Show my sentence</button>
            </div>
        </div>

        <!-- Results -->
        <div class="results" id="results">
            <div class="results-header">
                <div id="summary"></div>
            </div>
            <div class="actions">
                <button class="button button-secondary" onclick="reset()">Start Over</button>
                <button class="button" id="copyBtn" onclick="copySentence()">Copy sentence</button>
            </div>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------------
        // DATA (edit this section to change teams, pathways, lenses, activities)
        // ---------------------------------------------------------------
        const teams = {
            systems: {
                label: 'Systems and Services',
                areas: ['insights', 'influence', 'design']
            },
            solutions: {
                label: 'Solutions',
                areas: ['funds', 'frontier', 'initiatives']
            }
        };

        const areas = {
            insights: 'Insights',
            influence: 'Influence',
            design: 'Design',
            funds: 'Funds and financing',
            frontier: 'Frontier technology',
            initiatives: 'Initiatives'
        };

        // hasLens: true shows the problem-led / possibility-led choice under that pathway
        // outcome: shown in the smaller line under the main sentence
        const pathways = {
            accelerate: {
                label: 'Accelerate solutions',
                phrase: 'accelerate solutions',
                desc: 'Discover and de-risk emerging possibilities; identify, refine and scale proven innovations; generate credible evidence.',
                outcome: 'better evidence and solutions packaged for scale',
                hasLens: true
            },
            external: {
                label: 'Strengthen the external enabling environment',
                phrase: 'strengthen the external enabling environment',
                desc: 'Influence policy, markets and ecosystems; expand partnerships; increase financing, accessibility, availability and demand for responsible innovation.',
                outcome: 'strengthened partnerships and stronger demand',
                hasLens: false
            },
            internal: {
                label: 'Strengthen the internal enabling environment',
                phrase: 'strengthen the internal enabling environment',
                desc: 'Strengthen governance, culture, processes, capability and risk-taking so UNICEF can use innovation systematically and responsibly.',
                outcome: 'enabling conditions and skill development',
                hasLens: false
            }
        };

        const lenses = [
            { value: 'problem',     label: 'Problem-led',     phrase: 'problem-led' },
            { value: 'possibility', label: 'Possibility-led', phrase: 'possibility-led' }
        ];

        // label = what people click (your board wording)
        // phrase = how it reads in the sentence
        const activities = [
            { label: 'Scaling and Embedding Solutions',
              phrase: 'scaling and embedding solutions' },
            { label: 'Designing and Testing Solutions',
              phrase: 'designing and testing solutions' },
            { label: 'Finding and Prioritizing best options',
              phrase: 'finding and prioritizing best options' },
            { label: 'Generate and Harness Evidence',
              phrase: 'generating and harnessing evidence' },
            { label: 'Leverage Public and Private Financing for Scale',
              phrase: 'leveraging public and private financing for scale' },
            { label: 'Policy and Programme Advice',
              phrase: 'policy and programme advice' },
            { label: 'Advocate and expand partnerships',
              phrase: 'advocating for and expanding partnerships' },
            { label: 'Strengthening how innovation works',
              phrase: 'strengthening how innovation works' }
        ];

        const MAX_ACTIVITIES = 3;

        // ---------------------------------------------------------------
        // LOGIC
        // ---------------------------------------------------------------
        let selections = { team: null, area: null, pathway: null, lens: null, activities: [] };

        function renderOptions(containerId, items, onPick) {
            const container = document.getElementById(containerId);
            container.innerHTML = items.map(item => `
                <div class="option" data-value="${item.value}">
                    <div class="option-title">${item.title}</div>
                    ${item.desc ? `<div class="option-desc">${item.desc}</div>` : ''}
                </div>
            `).join('');

            container.querySelectorAll('.option').forEach(opt => {
                opt.addEventListener('click', () => {
                    container.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    onPick(opt.dataset.value);
                });
            });
        }

        // Multi-select chips with an optional maximum. Mutates selectedList in place.
        function renderChips(containerId, items, selectedList, max, onChange) {
            const container = document.getElementById(containerId);
            container.classList.remove('maxed');
            container.innerHTML = items.map(item =>
                `<button type="button" class="chip" data-value="${item}">${item}</button>`
            ).join('');

            container.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const value = chip.dataset.value;
                    const index = selectedList.indexOf(value);

                    if (index > -1) {
                        selectedList.splice(index, 1);
                        chip.classList.remove('selected');
                    } else if (!max || selectedList.length < max) {
                        selectedList.push(value);
                        chip.classList.add('selected');
                    }

                    if (max) {
                        container.classList.toggle('maxed', selectedList.length >= max);
                    }
                    onChange();
                });
            });
        }

        // Question 3: pathway cards, with a lens panel tucked under any pathway that has one
        function renderPathwayQuestion() {
            renderOptions(
                'pathwayOptions',
                Object.entries(pathways).map(([value, p]) => ({ value, title: p.label, desc: p.desc })),
                pickPathway
            );

            Object.entries(pathways).forEach(([value, p]) => {
                if (!p.hasLens) return;

                const card = document.querySelector(`#pathwayOptions .option[data-value="${value}"]`);
                const panel = document.createElement('div');
                panel.className = 'lens-panel';
                panel.id = `lensPanel-${value}`;
                panel.innerHTML = `
                    <div class="lens-panel-label">Is your work problem-led or possibility-led?</div>
                    <div class="lens-options">
                        ${lenses.map(l => `<button type="button" class="chip" data-value="${l.value}">${l.label}</button>`).join('')}
                    </div>
                `;
                card.insertAdjacentElement('afterend', panel);

                panel.querySelectorAll('.chip').forEach(chip => {
                    chip.addEventListener('click', () => pickLens(chip.dataset.value, chip));
                });
            });
        }

        function hideLensPanels() {
            document.querySelectorAll('.lens-panel').forEach(panel => {
                panel.style.display = 'none';
                panel.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            });
        }

        function pickTeam(value) {
            selections.team = value;
            selections.area = null;

            document.getElementById('areaLabel').textContent =
                `2. Which part of ${teams[value].label} are you in?`;

            renderOptions(
                'areaOptions',
                teams[value].areas.map(a => ({ value: a, title: areas[a] })),
                pickArea
            );

            updateProgress(2);
            showQuestion('q2');
        }

        function pickArea(value) {
            selections.area = value;
            updateProgress(3);
            showQuestion('q3');
        }

        function pickPathway(value) {
            selections.pathway = value;
            selections.lens = null;
            selections.activities = [];
            hideLensPanels();

            // Pathways with a lens wait for that choice before moving on
            if (pathways[value].hasLens) {
                document.getElementById(`lensPanel-${value}`).style.display = 'block';
                return;
            }

            goToFocus();
        }

        function pickLens(value, chip) {
            selections.lens = value;
            chip.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            chip.classList.add('selected');
            goToFocus();
        }

        function goToFocus() {
            const activityLabels = activities.map(a => a.label);

            renderChips('activityChips', activityLabels, selections.activities, MAX_ACTIVITIES, updateBuildButton);

            updateBuildButton();
            updateProgress(4);
            showQuestion('q4');
        }

        function updateBuildButton() {
            document.getElementById('buildBtn').disabled = selections.activities.length === 0;
        }

        function showQuestion(id) {
            document.querySelectorAll('.question-section').forEach(q => q.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function updateProgress(currentStep) {
            document.querySelectorAll('.progress-step').forEach(step => {
                step.classList.remove('active', 'completed');
            });
            for (let i = 1; i < currentStep; i++) {
                document.getElementById(`step${i}`).classList.add('completed');
            }
            document.getElementById(`step${currentStep}`).classList.add('active');
        }

        // "a, b and c" with each item highlighted
        function joinHighlighted(items) {
            const wrapped = items.map(i => `<span class="highlight">${i}</span>`);
            if (wrapped.length <= 1) return wrapped.join('');
            return wrapped.slice(0, -1).join(', ') + ' and ' + wrapped[wrapped.length - 1];
        }

        function showResults() {
            const { team, area, pathway, lens } = selections;
            const p = pathways[pathway];

            const activityPhrases = selections.activities.map(label =>
                activities.find(a => a.label === label).phrase
            );
            const activityList = joinHighlighted(activityPhrases);

            let opener = 'My';
            if (lens) {
                const lensPhrase = lenses.find(l => l.value === lens).phrase;
                opener = `Taking a <span class="highlight">${lensPhrase}</span> approach, my`;
            }

            document.querySelectorAll('.question-section').forEach(q => q.classList.add('hidden'));
            document.getElementById('results').classList.add('active');

            document.getElementById('summary').innerHTML = `
                <div class="session-goal">
                    I work in <span class="highlight">${areas[area].toLowerCase()}</span> within <span class="highlight">${teams[team].label}</span>.
                    ${opener} work focuses on ${activityList},
                    helping to <span class="highlight">${p.phrase}</span>,
                    so that innovation advances results for children.
                </div>
                <div class="session-sub">
                    My work most closely works toward the output <span class="highlight">${p.outcome}</span>.
                </div>
            `;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copySentence() {
            const text = document.getElementById('summary').textContent.replace(/\s+/g, ' ').trim();
            const btn = document.getElementById('copyBtn');

            navigator.clipboard.writeText(text)
                .then(() => {
                    btn.textContent = 'Copied';
                    setTimeout(() => { btn.textContent = 'Copy sentence'; }, 1500);
                })
                .catch(() => {
                    btn.textContent = 'Copy failed';
                    setTimeout(() => { btn.textContent = 'Copy sentence'; }, 1500);
                });
        }

        function reset() {
            selections = { team: null, area: null, pathway: null, lens: null, activities: [] };
            document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            hideLensPanels();
            document.getElementById('results').classList.remove('active');
            showQuestion('q1');
            updateProgress(1);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Build questions 1 and 3 on load (2 and 4 depend on earlier answers)
        renderOptions(
            'teamOptions',
            Object.entries(teams).map(([value, t]) => ({ value, title: t.label })),
            pickTeam
        );

        renderPathwayQuestion();
    </script>
</body>
</html>
