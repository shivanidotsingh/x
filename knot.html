<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wicked</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥨</text></svg>">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100vh; overflow: hidden; background: #f5f4f0; }
#c { display: block; width: 100%; height: 100vh; cursor: grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const DPR = devicePixelRatio || 1;

function resize() {
  canvas.width = canvas.offsetWidth * DPR;
  canvas.height = canvas.offsetHeight * DPR;
  ctx.scale(DPR, DPR);
}
resize();
window.addEventListener('resize', () => { resize(); initialised = false; });

const W = () => canvas.offsetWidth;
const H = () => canvas.offsetHeight;
const isPortrait = () => W() < H();

function beginFrame() {
  ctx.clearRect(0, 0, W(), H());
  ctx.save();
  if (isPortrait()) {
    ctx.translate(W()/2, H()/2);
    ctx.rotate(Math.PI / 2);
    ctx.translate(-H()/2, -W()/2);
  }
}
function endFrame() { ctx.restore(); }

function LW() { return isPortrait() ? H() : W(); }
function LH() { return isPortrait() ? W() : H(); }
function LCX() { return LW() / 2; }
function LCY() { return LH() / 2; }

const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
const FG = isDark ? 'rgba(235,230,220,ALPHA)' : 'rgba(22,20,18,ALPHA)';
const FONT_SC = '500 10px -apple-system, sans-serif';
const LETTER_SP = 2.2;
const PHRASE_SEP = 18;

function toSC(s) { return s.toUpperCase(); }

const allPhrases = [
  "Global poverty and economic inequality",
  "Climate change",
  "Gender-based violence and domestic abuse",
  "Labor exploitation",
  "Refugee crises and forced migration",
  "Systemic racism and racial injustice",
  "Healthcare accessibility and affordability",
  "Access to Education",
  "Energy sustainability and transition",
  "Aging population care and support",
  "Youth unemployment",
  "Artificial intelligence ethics and governance",
  "Organized crime and corruption",
  "Misinformation and disinformation",
].map(toSC);

const R_TIGHT = 115, R_LOOSE = 340;

function knotXY(t, R) {
  const phi = 5*t + 0.8, theta = 7*t + 1.3;
  const r = R*0.52 + R*0.48*Math.cos(theta);
  let x = LCX() + r*Math.cos(phi)*0.82;
  let y = LCY() + r*Math.sin(phi)*0.92 + R*0.48*Math.sin(theta)*0.42;
  x += R * 0.06 * Math.sin(3*t + 0.7);
  y += R * 0.09 * Math.sin(3*t + 2.1);
  return { x, y };
}

function buildKnot(R, N=8000) {
  const pts = [];
  for (let i = 0; i <= N; i++) pts.push(knotXY(i/N*Math.PI*2, R));
  const arc = [0];
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i].x-pts[i-1].x, dy = pts[i].y-pts[i-1].y;
    arc.push(arc[i-1] + Math.sqrt(dx*dx+dy*dy));
  }
  return { pts, arc, len: arc[arc.length-1] };
}

const KT = buildKnot(R_TIGHT), KL = buildKnot(R_LOOSE);
let tightness = 1.0, tgtTight = 1.0;

function knotPtAtS(knot, s) {
  const { pts, arc } = knot;
  s = ((s % knot.len) + knot.len) % knot.len;
  let lo = 0, hi = pts.length-1;
  while (lo < hi-1) { const m=(lo+hi)>>1; arc[m]<=s?(lo=m):(hi=m); }
  const t = (s-arc[lo])/(arc[hi]-arc[lo]||1);
  const ni = Math.min(lo+5, pts.length-1);
  return {
    x: pts[lo].x + t*(pts[hi].x-pts[lo].x),
    y: pts[lo].y + t*(pts[hi].y-pts[lo].y),
    angle: Math.atan2(pts[ni].y-pts[lo].y, pts[ni].x-pts[lo].x)
  };
}

function knotPt(s) {
  const k = 1-tightness;
  const pl = knotPtAtS(KL, s);
  const pt = knotPtAtS(KT, s/KL.len*KT.len);
  return {
    x: pt.x+(pl.x-pt.x)*k,
    y: pt.y+(pl.y-pt.y)*k,
    angle: pt.angle+(pl.angle-pt.angle)*k
  };
}

function knotLen() { return KT.len+(KL.len-KT.len)*(1-tightness); }

const MARGIN = 10;
function currentR()   { return R_TIGHT+(R_LOOSE-R_TIGHT)*(1-tightness); }
function leftTailW()  { return LCX()-currentR()-MARGIN; }
function rightTailW() { return LCX()-currentR()-MARGIN; }
function leftTailX()  { return MARGIN; }
function rightTailX() { return LCX()+currentR(); }
function totalPathLen() { return leftTailW() + knotLen() + rightTailW(); }

const BLEND = 60;

function pathPt(s) {
  const ltw = leftTailW();
  const kl  = knotLen();
  const kEnd = ltw + kl;

  if (s <= 0) return { x: leftTailX(), y: LCY(), angle: 0 };
  if (s >= ltw + kl + rightTailW()) return { x: rightTailX()+rightTailW(), y: LCY(), angle: 0 };

  if (s <= ltw) return { x: leftTailX()+s, y: LCY(), angle: 0 };

  if (s >= kEnd) return { x: rightTailX()+(s-kEnd), y: LCY(), angle: 0 };

  const ks = s - ltw;
  const rawPt = knotPt(ks/kl*KL.len);

  if (ks < BLEND) {
    const t = ks / BLEND;
    const ease = t * t * (3 - 2*t);
    const tailPt = { x: leftTailX()+s, y: LCY(), angle: 0 };
    return {
      x: tailPt.x + (rawPt.x - tailPt.x) * ease,
      y: tailPt.y + (rawPt.y - tailPt.y) * ease,
      angle: rawPt.angle * ease
    };
  }

  const distFromEnd = kl - ks;
  if (distFromEnd < BLEND) {
    const t = distFromEnd / BLEND;
    const ease = t * t * (3 - 2*t);
    const tailPt = { x: rightTailX()+(s-kEnd), y: LCY(), angle: 0 };
    return {
      x: tailPt.x + (rawPt.x - tailPt.x) * ease,
      y: tailPt.y + (rawPt.y - tailPt.y) * ease,
      angle: rawPt.angle * ease
    };
  }

  return rawPt;
}

ctx.font = FONT_SC;
function getCW(ch) { return ctx.measureText(ch).width; }

let charSeq = [];
function buildCharSeq() {
  charSeq = [];
  let cumW = 0;
  allPhrases.forEach((phrase, pi) => {
    for (const ch of phrase) {
      charSeq.push({ ch, pi, cumW });
      cumW += getCW(ch) + LETTER_SP;
    }
    if (pi < allPhrases.length-1) cumW += PHRASE_SEP - LETTER_SP;
  });
}
buildCharSeq();

function totalTextW() {
  if (!charSeq.length) return 0;
  const last = charSeq[charSeq.length-1];
  return last.cumW + getCW(last.ch);
}

let pathOffset = 0;
let initialised = false;

function getScale() {
  const pathLen = totalPathLen();
  const textLen = totalTextW();
  const sumGlyphs = charSeq.reduce((a,c)=>a+getCW(c.ch),0);
  const sumGaps = textLen - sumGlyphs;
  if (sumGaps <= 0) return 1;
  return Math.max(0.3, (pathLen - sumGlyphs) / sumGaps);
}

let _lastScale = -1, _scaledPos = [];
function scaledPositions(scale) {
  if (Math.abs(scale - _lastScale) < 0.001) return _scaledPos;
  _lastScale = scale;
  _scaledPos = [];
  let pos = 0;
  allPhrases.forEach((phrase, pi) => {
    for (let i = 0; i < phrase.length; i++) {
      _scaledPos.push(pos);
      const ch = phrase[i];
      pos += getCW(ch) + LETTER_SP * scale;
    }
    if (pi < allPhrases.length-1) pos += PHRASE_SEP * scale - LETTER_SP * scale;
  });
  const pathLen = totalPathLen();
  const lastChar = charSeq[charSeq.length-1];
  const lastEnd = _scaledPos[_scaledPos.length-1] + getCW(lastChar.ch);
  if (lastEnd > 0 && Math.abs(lastEnd - pathLen) > 0.5) {
    const correction = pathLen / lastEnd;
    for (let i = 0; i < _scaledPos.length; i++) _scaledPos[i] *= correction;
  }
  return _scaledPos;
}

function drawAll(scale) {
  ctx.font = FONT_SC;
  ctx.fillStyle = FG.replace('ALPHA','0.85');
  ctx.textBaseline = 'alphabetic';

  const positions = scaledPositions(scale);
  const pathLen = totalPathLen();
  let curPi = -1, phraseGroup = [];

  function flushGroup() {
    if (!phraseGroup.length) return;
    const first = phraseGroup[0];
    const last  = phraseGroup[phraseGroup.length-1];
    const firstS = pathOffset + positions[first.idx];
    const lastS  = pathOffset + positions[last.idx] + getCW(last.ch);
    const midS   = (firstS + lastS) / 2;

    if (lastS < 0 || firstS > pathLen) { phraseGroup = []; return; }

    const midPt = pathPt(Math.max(0, Math.min(pathLen, midS)));
    let ang = midPt.angle;
    while (ang >  Math.PI) ang -= Math.PI*2;
    while (ang < -Math.PI) ang += Math.PI*2;
    const leftward = Math.abs(ang) > Math.PI/2;

    if (!leftward) {
      for (const { ch, idx } of phraseGroup) {
        const s = pathOffset + positions[idx] + getCW(ch)/2;
        if (s < -20 || s > pathLen+20) continue;
        const pt = pathPt(Math.max(0, Math.min(pathLen, s)));
        let a = pt.angle;
        while (a >  Math.PI) a -= Math.PI*2;
        while (a < -Math.PI) a += Math.PI*2;
        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(a);
        ctx.fillText(ch, -getCW(ch)/2, 4);
        ctx.restore();
      }
    } else {
      const phraseStartS = firstS;
      const phraseW = lastS - firstS;
      for (const { ch, idx } of phraseGroup) {
        const localPos = (pathOffset + positions[idx]) - phraseStartS;
        const mirrored = phraseW - localPos - getCW(ch);
        const s = phraseStartS + mirrored + getCW(ch)/2;
        if (s < -20 || s > pathLen+20) continue;
        const pt = pathPt(Math.max(0, Math.min(pathLen, s)));
        let a = pt.angle;
        while (a >  Math.PI) a -= Math.PI*2;
        while (a < -Math.PI) a += Math.PI*2;
        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(a + Math.PI);
        ctx.fillText(ch, -getCW(ch)/2, 4);
        ctx.restore();
      }
    }
    phraseGroup = [];
  }

  charSeq.forEach(({ ch, pi }, idx) => {
    if (pi !== curPi) { flushGroup(); curPi = pi; }
    phraseGroup.push({ ch, idx });
  });
  flushGroup();
}

let isDragging = false;
let tailDrag = null, tailDragOrigin = 0, tailDragTight0 = 1.0;
let dragLastX = 0;

function cxy(e) {
  const r = canvas.getBoundingClientRect();
  let x = e.clientX - r.left;
  let y = e.clientY - r.top;
  if (isPortrait()) {
    const ox = x - W()/2, oy = y - H()/2;
    x = H()/2 + oy;
    y = W()/2 - ox;
  }
  return { x, y };
}

function hitTest(mx, my) {
  if (Math.abs(my-LCY()) < 22) {
    if (mx >= MARGIN && mx <= leftTailX()+leftTailW()) return { type:'tail', side:'left' };
    if (mx >= rightTailX() && mx <= rightTailX()+rightTailW()) return { type:'tail', side:'right' };
  }
  const dist = Math.sqrt((mx-LCX())**2+(my-LCY())**2);
  if (dist < currentR()*1.35) return { type:'knot' };
  return null;
}

canvas.addEventListener('pointerdown', e => {
  canvas.style.cursor = 'grabbing';
  const { x, y } = cxy(e);
  const hit = hitTest(x, y);
  if (!hit) return;
  if (hit.type === 'tail') {
    tailDrag = hit.side;
    tailDragOrigin = isPortrait() ? e.clientY : e.clientX;
    tailDragTight0 = tightness;
  } else {
    isDragging = true; dragLastX = e.clientX;
  }
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  if (tailDrag) {
    const delta = isPortrait() ? e.clientY - tailDragOrigin : e.clientX - tailDragOrigin;
    const pull = tailDrag === 'left' ? -delta : delta;
    tgtTight = Math.max(0.02, Math.min(1.0, tailDragTight0 + pull/200));
    return;
  }
  if (!isDragging) return;
  const { x, y } = cxy(e);
  const dist = Math.sqrt((x-LCX())**2+(y-LCY())**2);
  const looseness = Math.min(1, Math.max(0, (dist-R_TIGHT*0.3)/(R_LOOSE*1.4-R_TIGHT*0.3)));
  tgtTight = Math.min(tgtTight, 1-looseness*0.99);
  dragLastX = e.clientX;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tgtTight = Math.max(0.02, Math.min(1.0, tgtTight + e.deltaY * 0.0008));
}, { passive: false });

canvas.addEventListener('pointerup', () => {
  isDragging = false; tailDrag = null;
  canvas.style.cursor = 'grab';
});

function tick() {
  beginFrame();
  tightness = Math.max(0.02, Math.min(1.0, tightness + (tgtTight-tightness)*0.18));
  _lastScale = -1;
  const scale = getScale();
  if (!initialised) { pathOffset = 0; initialised = true; }
  drawAll(scale);
  endFrame();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
